apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: amdox-config
  namespace: {{ .Values.namespace }}
data:
  NODE_ENV: {{ .Values.config.NODE_ENV | quote }}
  PORT: {{ .Values.config.PORT | quote }}
  ML_SERVICE_URL: {{ .Values.config.ML_SERVICE_URL | quote }}
  ML_SERVICE_API_KEY: {{ .Values.config.ML_SERVICE_API_KEY | quote }}
  CLIENT_URL: {{ printf "https://%s" .Values.domain | quote }}
  FRONTEND_URL: {{ printf "https://%s" .Values.domain | quote }}
  CORS_ORIGINS: {{ printf "https://%s" .Values.domain | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: amdox-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "amdox.databaseUrl" . | quote }}
  REDIS_URL: {{ include "amdox.redisUrl" . | quote }}
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.JWT_REFRESH_SECRET | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.DB_PASSWORD | quote }}
  GMAIL_USER: {{ .Values.secrets.GMAIL_USER | quote }}
  GMAIL_APP_PASSWORD: {{ .Values.secrets.GMAIL_APP_PASSWORD | quote }}
