apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: amdox-config
  namespace: {{ .Values.namespace }}
data:
  NODE_ENV: {{ .Values.config.NODE_ENV | quote }}
  PORT: {{ .Values.config.PORT | quote }}
  ML_SERVICE_URL: {{ .Values.config.ML_SERVICE_URL | quote }}
  ML_SERVICE_API_KEY: {{ .Values.config.ML_SERVICE_API_KEY | quote }}
  CLIENT_URL: {{ printf "https://%s" .Values.domain | quote }}
  FRONTEND_URL: {{ printf "https://%s" .Values.domain | quote }}
  CORS_ORIGINS: {{ printf "https://%s" .Values.domain | quote }}
  OTEL_TRACES_ENABLED: {{ .Values.config.OTEL_TRACES_ENABLED | default "false" | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.OTEL_EXPORTER_OTLP_ENDPOINT | default "http://tempo:4318" | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.OTEL_SERVICE_NAME | default "amdox-backend" | quote }}
  KEYCLOAK_ENABLED: {{ .Values.config.KEYCLOAK_ENABLED | default "false" | quote }}
  KEYCLOAK_URL: {{ .Values.config.KEYCLOAK_URL | default "http://keycloak:8080/keycloak" | quote }}
  KEYCLOAK_ISSUER: {{ .Values.config.KEYCLOAK_ISSUER | default (printf "https://%s/keycloak/realms/amdox-erp" .Values.domain) | quote }}
  KEYCLOAK_REALM: {{ .Values.config.KEYCLOAK_REALM | default "amdox-erp" | quote }}
  KEYCLOAK_CLIENT_ID: {{ .Values.config.KEYCLOAK_CLIENT_ID | default "amdox-frontend" | quote }}
{{- if .Values.secrets.managed }}
---
# Rendered only when secrets.managed=true. For a GitOps flow (ArgoCD), set
# secrets.managed=false and create amdox-secrets out-of-band (sealed-secrets /
# external-secrets / kubectl) so real credentials never live in git.
apiVersion: v1
kind: Secret
metadata:
  name: amdox-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "amdox.databaseUrl" . | quote }}
  REDIS_URL: {{ include "amdox.redisUrl" . | quote }}
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.JWT_REFRESH_SECRET | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.DB_PASSWORD | quote }}
  GMAIL_USER: {{ .Values.secrets.GMAIL_USER | quote }}
  GMAIL_APP_PASSWORD: {{ .Values.secrets.GMAIL_APP_PASSWORD | quote }}
{{- end }}
