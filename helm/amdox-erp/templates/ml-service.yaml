{{- if .Values.ml.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: ml-service
  namespace: {{ .Values.namespace }}
spec:
  selector: { app: ml-service }
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.ml.replicas }}
  selector:
    matchLabels: { app: ml-service }
  template:
    metadata:
      labels: { app: ml-service }
    spec:
      containers:
        - name: ml-service
          image: "{{ .Values.images.ml.repo }}:{{ .Values.images.ml.tag }}"
          imagePullPolicy: {{ .Values.images.ml.pullPolicy }}
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: {{ include "amdox.databaseUrl" . | quote }}
            # Optional AI forecast insight (Claude). optional:true → pod starts
            # without the secret; the ML service simply omits insights.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: amdox-ml-ai
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: ANTHROPIC_MODEL
              value: {{ .Values.ml.anthropicModel | default "claude-opus-5" | quote }}
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.ml.resources | nindent 12 }}
{{- end }}
