name: Prod — Smoke Test

# Continuous delivery is handled by ArgoCD (see argocd/) — the cluster syncs the
# Helm chart from git automatically, so there is no imperative "deploy" step here
# anymore. This workflow just verifies production is healthy: run it by hand after
# a release, or it fires automatically on a v*.*.* tag.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  smoke-test:
    name: Production smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Liveness + readiness probes
        run: |
          BASE="${{ secrets.PROD_URL }}"
          echo "Probing $BASE …"
          curl -fsS "$BASE/api/v1/health/live"  && echo "  ✓ live"
          curl -fsS "$BASE/api/v1/health/ready" && echo "  ✓ ready"

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "Production smoke test ${{ job.status }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
