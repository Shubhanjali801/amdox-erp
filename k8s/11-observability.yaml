# ─────────────────────────────────────────────────────────────────────────────
# Observability stack — LOGS (Loki + Promtail) and TRACES (Tempo via OpenTelemetry)
#
# Complements the metrics already provided by Prometheus + Grafana (09-monitoring).
# Grafana datasources for Loki + Tempo are provisioned in 09-monitoring.yaml.
#
#   • Loki      — central log store; Promtail (DaemonSet) ships every pod's
#                 stdout into it, so all service logs are searchable in Grafana.
#   • Tempo     — trace store; receives OTLP spans the backend emits via the
#                 OpenTelemetry SDK (backend/src/telemetry.ts). Enable tracing by
#                 setting OTEL_TRACES_ENABLED=true in deploy.env, then redeploy.
#
# RAM note: this adds ~600Mi of requests to the node. Apply it when there is
# headroom (e.g. scale ml-service to 0 during an observability demo):
#   kubectl apply -f k8s/11-observability.yaml
# View everything in Grafana:  kubectl -n amdox port-forward svc/grafana 3000:3000
# ─────────────────────────────────────────────────────────────────────────────

# ═══════════════════════════ LOKI (log store) ═══════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: amdox
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 168h        # keep logs 7 days
      reject_old_samples: false
      allow_structured_metadata: false
    analytics:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: amdox
spec:
  replicas: 1
  selector:
    matchLabels: { app: loki }
  template:
    metadata:
      labels: { app: loki }
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.8
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - { containerPort: 3100, name: http }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: storage, mountPath: /loki }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: storage
          emptyDir: {}          # ephemeral — logs survive restarts of other pods, not of Loki itself
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: amdox
spec:
  selector: { app: loki }
  ports:
    - { port: 3100, targetPort: 3100 }

# ═════════════════════════ PROMTAIL (log shipper) ═══════════════════════════
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: amdox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amdox-promtail
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amdox-promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: amdox-promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: amdox
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: amdox
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki:3100/loki/api/v1/push
    scrape_configs:
      # Discover every pod and tail its container logs, attaching k8s labels
      # (namespace / pod / container / app) so you can filter in Grafana.
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: amdox
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: amdox
spec:
  selector:
    matchLabels: { app: promtail }
  template:
    metadata:
      labels: { app: promtail }
    spec:
      serviceAccountName: promtail
      containers:
        - name: promtail
          image: grafana/promtail:2.9.8
          args: ["-config.file=/etc/promtail/promtail.yaml"]
          volumeMounts:
            - { name: config, mountPath: /etc/promtail }
            - { name: run, mountPath: /run/promtail }
            - { name: pods, mountPath: /var/log/pods, readOnly: true }
            - { name: containers, mountPath: /var/lib/docker/containers, readOnly: true }
          resources:
            requests: { cpu: "20m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
      volumes:
        - name: config
          configMap: { name: promtail-config }
        - name: run
          emptyDir: {}
        - name: pods
          hostPath: { path: /var/log/pods }
        - name: containers
          hostPath: { path: /var/lib/docker/containers }

# ═══════════════════════════ TEMPO (trace store) ════════════════════════════
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: amdox
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            http:                 # backend exports here (OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318)
              endpoint: 0.0.0.0:4318
            grpc:
              endpoint: 0.0.0.0:4317
    ingester:
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: 24h      # keep traces 1 day
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/blocks
        wal:
          path: /var/tempo/wal
    usage_report:
      reporting_enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: amdox
spec:
  replicas: 1
  selector:
    matchLabels: { app: tempo }
  template:
    metadata:
      labels: { app: tempo }
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.5.0
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - { containerPort: 3200, name: http }
            - { containerPort: 4318, name: otlp-http }
            - { containerPort: 4317, name: otlp-grpc }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: storage, mountPath: /var/tempo }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
      volumes:
        - name: config
          configMap: { name: tempo-config }
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: amdox
spec:
  selector: { app: tempo }
  ports:
    - { name: http,      port: 3200, targetPort: 3200 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
